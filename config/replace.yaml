# 法规常用词替换/清洗规则
# 格式: [查找文本, 替换文本]
replacements:
  # 全角半角统一
  - ["：", ":"]
  - ["（", "("]
  - ["）", ")"]
  - ["，", ","]
  - ["。", "."]
  - ["　", " "]  # 全角空格 → 半角空格

  # 常见印刷错误统一
  - ["l令", "令"]         # OCR 误识别

# 页眉页脚签名规则
# 匹配后整行丢弃
header_footer_signatures:
  - "版权所有"
  - "未经许可"
  - "仅供内部使用"
  - "制定"
  - "发布"
