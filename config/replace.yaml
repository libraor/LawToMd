# 法规常用词替换/清洗规则
# 格式: [查找文本, 替换文本]
# 注意：法律文本中的中文标点（，。：；（）等）应保留全角，不做转换
replacements:
  # 全角空格 → 半角空格
  - ["\u3000", " "]  # 全角空格

  # OCR 常见误识别修正
  - ["l令", "令"]
  - ["第0条", "第十条"]     # OCR: 0/十 混淆
  - ["第O条", "第〇条"]     # OCR: O/〇 混淆
  - ["第I条", "第一条"]     # OCR: I/一 混淆
  - ["第l条", "第一条"]     # OCR: l/一 混淆

  # 常见法律术语拼写修正
  - ["中华人民共国", "中华人民共和国"]
  - ["全国人民代表大", "全国人民代表大会"]

# 页眉页脚签名规则
# 匹配后整行丢弃
header_footer_signatures:
  - "版权所有"
  - "未经许可"
  - "仅供内部使用"
  - "内部资料"
  - "仅供参考"
